name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      # The @bayanihan/* packages aren't on npm yet, so the sibling repositories sit side by side, as in the README.
      - uses: actions/checkout@v4
        with: { path: dasig-app }
      - uses: actions/checkout@v4
        with: { repository: Dasig-org/bix, path: bix }
      - uses: actions/checkout@v4
        with: { repository: Dasig-org/bayanihan, path: bayanihan }
      - uses: actions/checkout@v4
        with: { repository: Dasig-org/bayani, path: bayani }

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - run: npm ci
        working-directory: bix
      - run: npm ci
        working-directory: bayanihan
      - run: npm ci
        working-directory: bayani
      - run: npm ci
        working-directory: dasig-app/app
      - run: npx tsc --noEmit
        working-directory: dasig-app/app
