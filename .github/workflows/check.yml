name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Skip install scripts: llama.rn downloads its native iOS/Android builds, which these checks don't need.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npx expo lint
      - run: npm test
